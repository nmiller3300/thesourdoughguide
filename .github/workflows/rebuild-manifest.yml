name: Rebuild Post Manifest

on:
  push:
    paths:
      - 'posts/**.md'

jobs:
  rebuild-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python .github/scripts/rebuild_manifest.py
      - run: |
          git config --global user.name "Sourdough Bot"
          git config --global user.email "bot@thesourdoughguide.com"
          git add posts/manifest.json
          git diff --staged --quiet || git commit -m "Auto: rebuild manifest"
          git push
