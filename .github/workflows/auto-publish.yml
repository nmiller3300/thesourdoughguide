name: AI Auto-Publish Post

on:
  schedule:
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install anthropic
      - name: Generate post
        run: python .github/scripts/generate_post.py
      - name: Rebuild manifest
        run: python .github/scripts/rebuild_manifest.py
      - name: Commit and push
        run: |
          git config --global user.name "Sourdough Bot"
          git config --global user.email "bot@thesourdoughguide.com"
          git add posts/
          git diff --staged --quiet || git commit -m "Auto: new post"
          git push
