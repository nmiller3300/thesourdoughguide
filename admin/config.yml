backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://thesourdoughguide.com
display_url: https://thesourdoughguide.com

collections:
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{category}} ({{date}})"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The full title of your post" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Beginner Guide", value: "beginner" }
          - { label: "Recipe", value: "recipe" }
          - { label: "Troubleshooting", value: "troubleshooting" }
          - { label: "Equipment", value: "equipment" }
          - { label: "Advanced Technique", value: "advanced" }
      - { label: "Publish Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Read Time", name: "readtime", widget: "string", hint: "e.g. 5 min read", default: "5 min read" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "1-2 sentence description shown on listing pages. Keep under 150 characters." }
      - { label: "Post Content", name: "body", widget: "markdown" }
