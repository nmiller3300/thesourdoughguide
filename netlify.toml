[[redirects]]
  from = "http://thesourdoughguide.com/*"
  to = "https://thesourdoughguide.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.thesourdoughguide.com/*"
  to = "https://thesourdoughguide.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
